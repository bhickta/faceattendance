name: Frappe App CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install ruff==0.12.11
      - name: Lint server app
        run: ruff check server/face_attendance
      - name: Compile Python sources
        run: python -m compileall -q server/face_attendance/face_attendance
      - name: Build installable app package
        run: python -m pip wheel --no-deps --wheel-dir /tmp/face-attendance-wheel server/face_attendance
      - name: Validate DocType JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("server/face_attendance").rglob("*.json"):
              json.loads(path.read_text())
          PY
      - name: Validate Desk JavaScript
        run: |
          node --check server/face_attendance/face_attendance/public/js/employee.js
          node --check server/face_attendance/face_attendance/face_attendance/doctype/attendance_device/attendance_device.js
